[package]
name = "zkar-bench"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
publish = false

[[bin]]
name = "zkar-bench"
path = "src/main.rs"

[dependencies]
bincode = { version = "=2.0.1", features = ["serde"] }
libc = "=0.2.191"
rayon = "=1.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
zkar-prover = { path = "../zkar-prover" }
