[package]
name = "zkar-prover"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true

[dependencies]
nova-snark = "=0.76.0"
halo2_poseidon = { version = "=0.2.0", features = ["test-dependencies"] }
halo2curves = "=0.9.0"
pasta_curves = "=0.6.1"
ff = "=0.13.1"
ff14 = { package = "ff", version = "=0.14.0" }
group = "=0.13.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rand_chacha = "=0.3.1"
num-bigint = "=0.4.8"
base64 = "=0.22.1"
bincode = { version = "=2.0.1", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
zkar-circuit = { path = "../zkar-circuit" }
zkar-core = { path = "../zkar-core" }

[dev-dependencies]
ed25519-dalek = "=2.2.0"
relation = { path = "../../../zkvm-baseline/relation" }
serde_json.workspace = true

